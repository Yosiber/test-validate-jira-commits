name: Validate Jira Commits
author: kadanarpaOps
description: Extracts commits since the last successful workflow run and validates them against Jira.

inputs:
  workflow-name:
    description: 'The Workflow to be validated against the GitHub API'
    required: true

  jira-url:
    description: 'Jira Base URL to Fetch'
    required: true

  jira-email:
    description: 'Jira Owner Workspace Email'
    required: true

  jira-token:
    description: 'Jira Permissions Token'
    required: true

  jira-prefix:
    description: 'Jira Code Prefix'
    required: true

runs:
  using: "composite"
  steps:
    # ------------------------------------------------------------------------
    # STEP 1: Get SHA ID of Last Success Run
    # ------------------------------------------------------------------------
    - name: Fetch SHA from GitHub API
      id: fetch-sha
      uses: actions/github-script@v7
      with:
        script: |
          // Obtain actual branch cleaning 'ref'
          const branch = context.ref.replace('refs/heads/', '');

          // Obtain the workflow name
          const workflowName = '${{ inputs.workflow-name }}';

          console.log(`Searching successful runs for workflow: ${workflowName} in branch: ${branch}`);

          // Call GitHub API
          const runs = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: workflowName,
            branch: branch,
            status: 'success',
            per_page: 1,
          });

          if (runs.data.total_count === 0) {
            console.log('No previous successful run found. Will validate HEAD only.');
            core.setOutput('sha', '');
          } else {
            const lastSha = runs.data.workflow_runs[0].head_sha;
            console.log(`Last successful run was at commit: ${lastSha}`);
            core.setOutput('sha', lastSha);
          }

    # ------------------------------------------------------------------------
    # STEP 2: Get Commit Messages since Last SHA
    # ------------------------------------------------------------------------
    - name: Extract Commits Messages
      id: extract
      shell: bash
      run: |
        LAST_SHA="${{ steps.fetch-sha.outputs.sha }}"
        
        if [ -n "$LAST_SHA" ] && ! git cat-file -e "${LAST_SHA}^{commit}" 2>/dev/null; then
          echo "WARNING: Last successful SHA $LAST_SHA no longer exists in history."
          echo "Falling back to merge-base strategy."
          LAST_SHA=""
        fi 

        if [ -z "$LAST_SHA" ]; then
          echo "No baseline SHA found. Searching last divergement"
          DEFAULT_BRANCH=$(jq -r '.repository.default_branch' "$GITHUB_EVENT_PATH")
          echo "Default branch: $DEFAULT_BRANCH"
        
          DIVERGED_SHA=$(git merge-base HEAD "origin/$DEFAULT_BRANCH" 2>/dev/null || echo "")
        
          if [ -z "$DIVERGED_SHA" ]; then
            echo "No merge base found. Collecting all commits in history"
            git log --pretty=format:"%s" > /tmp/raw_commits.txt
          else
            echo "Collecting all commits since branch was created"
            echo "Branch DIVERGED_SHA: $DIVERGED_SHA"
            git log "${DIVERGED_SHA}..HEAD" --pretty=format:"%s" > /tmp/raw_commits.txt
          fi
        else
          git log "${LAST_SHA}..HEAD" --pretty=format:"%s" > /tmp/raw_commits.txt
        fi

        echo "Commits to validate:"
        cat /tmp/raw_commits.txt
        echo ""

        COUNT=$(grep -c "" /tmp/raw_commits.txt 2>/dev/null || echo 0)
        echo "Total commits to validate: $COUNT"

        EOF="COMMIT_MESSAGES_$(date +%s)"

        echo "messages<<$EOF" >> "$GITHUB_OUTPUT"
        cat /tmp/raw_commits.txt >> "$GITHUB_OUTPUT"
        echo "" >> "$GITHUB_OUTPUT"
        echo "$EOF" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------------
    # STEP 3: Validate List of Commits against Jira
    # ------------------------------------------------------------------------
    - name: Process and Validate each Message
      shell: bash
      env:
        JIRA_URL: ${{ inputs.jira-url }}
        JIRA_EMAIL: ${{ inputs.jira-email }}
        JIRA_TOKEN: ${{ inputs.jira-token }}
        JIRA_PREFIX: ${{ inputs.jira-prefix }}
      run: |
        FAILED=0

        echo "${{ steps.extract.outputs.messages }}" > /tmp/messages_to_process.txt

        echo "==== FILE CONTENT ===="
        cat /tmp/messages_to_process.txt
        echo "======================"

        while IFS= read -r COMMIT_MSG || [ -n "$COMMIT_MSG" ]; do
          if [ -z "$COMMIT_MSG" ]; then
            continue
          fi

          echo "--------------------------------------------"
          echo "Validating: $COMMIT_MSG"

          CLEAN_MSG=$(echo "$COMMIT_MSG" | tr -d '[](){}')
          echo "CLEAN_MSG: '${CLEAN_MSG}'"
          ISSUE_KEY=$(echo "$CLEAN_MSG" | grep -oP "${JIRA_PREFIX}-[0-9]+" | head -1 || true)
          echo "Extracted ISSUE_KEY: '${ISSUE_KEY}'"
        
          if [ -z "$ISSUE_KEY" ]; then
            echo "ERROR: No Jira key found in: '$COMMIT_MSG'"
            echo "Expected format: PROJECT-NUMBER anywhere in the message."
            FAILED=1
            continue
          fi

          echo "Found key: $ISSUE_KEY. Calling Jira API..."

          RESPONSE=$(curl -sf \
            -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            -H "Accept: application/json" \
            "$JIRA_URL/rest/api/3/issue/$ISSUE_KEY"
          )

          if [ $? -ne 0 ]; then
            echo "ERROR: Could not fetch issue $ISSUE_KEY from Jira."
            FAILED=1
            continue
          fi
        
          echo "==== JIRA RESPONSE ===="
          echo "$RESPONSE"
          echo "======================="

          ISSUE_TYPE=$(echo "$RESPONSE" | jq -r '.fields.issuetype.name')
          ISSUE_STATUS=$(echo "$RESPONSE" | jq -r '.fields.status.name')

          ISSUE_STATUS_NORMALIZED=$(echo "$ISSUE_STATUS" | tr '[:lower:]' '[:upper:]')

          echo "Type: $ISSUE_TYPE | Status: $ISSUE_STATUS"

          if [ "$ISSUE_TYPE" != "Tarea" ]; then
            echo "ERROR: $ISSUE_KEY is type '$ISSUE_TYPE'. Only 'Tarea' is allowed."
            FAILED=1
            continue
          fi

          if [ "$ISSUE_STATUS_NORMALIZED" != "Nuevo" ] \
             && [ "$ISSUE_STATUS_NORMALIZED" != "En Curso" ]; then
              echo "ERROR: $ISSUE_KEY has status '$ISSUE_STATUS'."
              echo "Only 'New' and 'En Curso' are allowed."
              FAILED=1
              continue
          fi

          echo "PASSED: $ISSUE_KEY"

        done < /tmp/messages_to_process.txt

        echo "--------------------------------------------"

        if [ $FAILED -ne 0 ]; then
          echo "One or more commits failed Jira validation."
          exit 1
        fi

        echo "All commits passed Jira validation."