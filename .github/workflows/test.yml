name: Test Jira Validation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Server: ${{ github.server_url }}"
          echo "Workflows:"
          gh workflow list --all

      - name: Validate Jira Commits
        uses: ./.github/actions/validate-jira-commits
        with:
          workflow-name: "test-jira-validation.yml"
          jira-url: ${{ secrets.JIRA_URL }}
          jira-email: ${{ secrets.JIRA_EMAIL }}
          jira-token: ${{ secrets.JIRA_TOKEN }}
          jira-prefix: "SCRUM"